# This configures training of a machine learning model for CosmoAI.
#
# Only one experiment is generated for this project, making this file
# redundant.  The generated file is kept as well.  It is retained as
# an example for future experiments.

[settings]
device = "cuda"
models = [ "regnet_y_32gf" ]
problem = "sie-problem.toml"

[hyperparameters.array]
learning-rate = [ 1e-3 ]
batch-size = [ 32 ]
weight-decay = [ 1e-4 ]

[training]
num-epochs = 50
patience = 10

[dataset]
directory = "images"

[output]
dirbase = "experiment%%"
# Predictions are placed in the output directory using the
# same filenames as the input files (training/testing/validation).
